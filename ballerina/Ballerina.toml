[package]
org = "ballerinax"
name = "mssql.cdc.driver"
version = "1.1.0"
authors = ["Ballerina"]
keywords = ["CDC", "Debezium", "Microsoft SQL Server", "MSSQL", "Area/Database", "Type/Driver", "Vendor/Red Hat"]
repository = "https://github.com/ballerina-platform/module-ballerinax-mssql.cdc.driver"
icon = "icon.png"
license = ["Apache-2.0"]
distribution = "2201.12.0"

[platform.java21]
graalvmCompatible = true

[[platform.java21.dependency]]
groupId = "io.ballerina.lib"
artifactId = "mssql.cdc.driver-native"
version = "1.1.0"
path = "../native/build/libs/mssql.cdc.driver-native-1.1.0.jar"

[[platform.java21.dependency]]
groupId = "io.debezium"
artifactId = "debezium-connector-sqlserver"
version = "3.5.1.Final"
path = "./lib/debezium-connector-sqlserver-3.5.1.Final.jar"
